plugins { id 'com.android.application' }
android {
    namespace 'com.xixi.whale'
    compileSdk 34
    defaultConfig {
        applicationId "com.xixi.whale"
        minSdk 21
        targetSdk 34
        versionCode 6
        versionName "1.5"
    }
    signingConfigs {
        fixed {
            storeFile rootProject.file('app/keystore.p12')
            storePassword 'whalechat'
            keyAlias 'whalechat'
            keyPassword 'whalechat'
            storeType 'PKCS12'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.fixed }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
